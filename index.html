<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Beads 사장님 가게 신청</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink: #0A0A0A; --sub: #5C5C5C; --line: #DADADA; --bg: #FFFFFF; --soft: #F4F4F2; --red: #D42C24; --red-dark: #B3221B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  .trial { background: var(--soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--sub); margin-bottom: 20px; }
  .trial b { color: var(--red); }
  .step { font-size: 14px; color: var(--sub); font-weight: 600; margin: 0 0 4px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 16px; letter-spacing: -0.01em; }
  .offer { border: 1.5px solid var(--red); border-radius: 12px; padding: 12px 14px; font-size: 16px; margin-bottom: 4px; }
  .offer b { color: var(--red); }
  .offer .count { display: block; font-size: 14px; color: var(--sub); margin-top: 2px; }
  label { display: block; font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
  .hint { font-weight: 400; color: var(--sub); font-size: 14px; }
  input[type=text], input[type=tel] { width: 100%; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 14px; font: inherit; color: var(--ink); background: #fff; }
  input:focus { outline: none; border-color: var(--ink); }
  .bad { border-color: var(--red) !important; }
  .err { color: var(--red); font-size: 14px; margin-top: 6px; min-height: 0; }
  .pick { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1.5px dashed #A8A8A8; border-radius: 12px; color: var(--sub); font-size: 15px; text-align: center; cursor: pointer; overflow: hidden; position: relative; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pick img { width: 52px; height: 52px; object-fit: cover; display: block; }
  .menu { border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 14px 14px; margin-top: 14px; }
  .menu .row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .menu label { margin-top: 10px; }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 400; color: var(--sub); margin-top: 16px; cursor: pointer; }
  .agree input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--ink); }
  .agree.bad { color: var(--red); }
  button { width: 100%; min-height: 56px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; font-size: 18px; margin-top: 28px; cursor: pointer; }
  .go { background: var(--red); color: #fff; }
  .go:active { background: var(--red-dark); }
  .back { background: none; color: var(--sub); font-weight: 500; font-size: 16px; margin-top: 8px; }
  .note { text-align: center; color: var(--sub); font-size: 13px; margin-top: 14px; }
  .done { text-align: center; padding-top: 24px; }
  .done .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 32px; margin: 0 auto 16px; }
  .sum { text-align: left; background: var(--soft); border-radius: 12px; padding: 14px 16px; margin-top: 20px; font-size: 15px; }
  .sum div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .sum span:first-child { color: var(--sub); flex: none; }
  .sum span:last-child { text-align: right; }
  [hidden] { display: none !important; }
</style>
</head><body><main>

<div class="trial"><b>시범용 화면</b> · 사진은 이 휴대폰 밖으로 나가지 않아요. 가게·메뉴 이름과 연락처만 저희가 종이에 받아 적어요.</div>

<!-- 1/2 메뉴 -->
<section id="s1">
  <p class="step">사장님 가게 신청 1/2</p>
  <h1>손님 생각이 가장 궁금한<br>메뉴 3개를 골라 주세요</h1>
  <div class="offer">메뉴 사진 3장을 올려 주시면 <b>첫 달(12월) 무료</b><span class="count" id="count">사진 0 / 3장</span></div>

  <label for="store">가게 이름</label>
  <input id="store" type="text" autocomplete="off" placeholder="예: 예시반점">

  <div id="menus"></div>
  <p class="err" id="e1" role="alert"></p>
  <button class="go" id="next">다음 · 연락처</button>
</section>

<!-- 2/2 연락처 -->
<section id="s2" hidden>
  <p class="step">사장님 가게 신청 2/2</p>
  <h1>정식판이 열리면<br>문자로 알려 드릴게요</h1>

  <label for="tel">휴대폰 번호</label>
  <input id="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13">

  <label class="agree" id="agreeBox"><input id="agree" type="checkbox"><span>정식판 안내와 첫 달 무료 안내 문자에만 쓰고, 2026년 12월 31일이 지나면 지우는 데 동의해요.</span></label>

  <p class="err" id="e2" role="alert"></p>
  <button class="go" id="finish">신청 끝내기</button>
  <button class="back" id="prev">이전</button>
</section>

<!-- 끝 -->
<section id="s3" class="done" hidden>
  <div class="mark">✓</div>
  <h1>신청을 마쳤어요</h1>
  <p style="color:var(--sub);margin:0" id="doneText"></p>
  <div class="sum" id="sum"></div>
  <button class="back" id="reset">처음부터 (다음 가게)</button>
</section>

<p class="note">서강대 창업팀 Beads · 시범용 창 · 사진은 저장되지 않음</p>
</main>

<script>
const $ = id => document.getElementById(id);
const show = n => { ['s1', 's2', 's3'].forEach((s, i) => $(s).hidden = i !== n - 1); scrollTo(0, 0); };

const examples = [['짜장면', '7,000'], ['짬뽕', '8,000'], ['탕수육', '15,000']];
$('menus').innerHTML = examples.map(([n, p], i) => `
  <div class="menu">
    <div class="row">
      <div><label for="m${i}">메뉴 ${i + 1}</label><input id="m${i}" type="text" autocomplete="off" placeholder="예: ${n}"></div>
      <div><label for="p${i}">가격 <span class="hint">(선택)</span></label><input id="p${i}" type="tel" inputmode="numeric" autocomplete="off" placeholder="${p}"></div>
    </div>
    <label>메뉴 사진</label>
    <div class="pick"><span id="pt${i}">📷 사진 찍기 / 앨범에서 고르기</span><img id="pi${i}" alt="" hidden><input id="ph${i}" type="file" accept="image/*" aria-label="메뉴 ${i + 1} 사진 고르기"></div>
  </div>`).join('');

const photos = () => examples.filter((_, i) => $('ph' + i).files.length > 0).length;
const updateCount = () => {
  const n = photos();
  $('count').textContent = n === 3 ? '사진 3 / 3장 · 첫 달 무료 대상이에요' : `사진 ${n} / 3장`;
};

examples.forEach((_, i) => {
  $('ph' + i).addEventListener('change', () => {
    const f = $('ph' + i).files[0];
    if (f) { $('pi' + i).src = URL.createObjectURL(f); $('pi' + i).hidden = false; $('pt' + i).textContent = '사진 바꾸기'; } // stays on this phone, never uploaded
    updateCount();
  });
  $('p' + i).addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 7);
    e.target.value = d ? Number(d).toLocaleString('ko-KR') : '';
  });
});

$('tel').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 11);
  const seoul = d.startsWith('02');
  const a = seoul ? 2 : 3, mid = d.length > a + 7 ? 4 : 3; // 02-123-4567 / 02-1234-5678 / 010-1234-5678
  e.target.value = d.length > a + mid ? `${d.slice(0, a)}-${d.slice(a, a + mid)}-${d.slice(a + mid)}` : d.length > a ? `${d.slice(0, a)}-${d.slice(a)}` : d;
});
const telOk = v => /^0\d{8,10}$/.test(v.replace(/\D/g, ''));

function check(fields, errBox, msg = '빨간 칸을 채워 주세요.') {
  let first = null;
  fields.forEach(([el, ok]) => { el.classList.toggle('bad', !ok); if (!ok && !first) first = el; });
  errBox.textContent = first ? msg : '';
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return !first;
}

const names = () => [0, 1, 2].map(i => $('m' + i).value.trim());

$('next').onclick = () => {
  const n = names();
  const ok = check([[$('store'), $('store').value.trim()], ...n.map((v, i) => [$('m' + i), v])], $('e1'));
  if (!ok) return;
  if (new Set(n).size < 3) { $('e1').textContent = '서로 다른 메뉴 3개를 넣어 주세요.'; return; }
  show(2);
};
$('prev').onclick = () => show(1);

$('finish').onclick = () => {
  const ok = check([[$('tel'), telOk($('tel').value)], [$('agreeBox'), $('agree').checked]], $('e2'),
    !telOk($('tel').value) ? '휴대폰 번호를 확인해 주세요.' : '동의에 체크해 주세요.');
  if (!ok) return;
  const n = names(), p = photos(), t = new Date();
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('doneText').innerHTML = p === 3
    ? '정식판이 열리면 문자로 링크를 보내 드릴게요.<br>오늘 고르신 메뉴·사진을 그대로 올리시면 <b>첫 달은 무료</b>예요.'
    : '정식판이 열리면 문자로 링크를 보내 드릴게요.<br>그때 메뉴 사진 3장을 올리시면 <b>첫 달은 무료</b>예요.';
  // summary is for the field team to copy onto the paper log (H3 = owner picked 3 menus + left a number)
  $('sum').innerHTML = [
    ['가게', esc($('store').value.trim())],
    ...n.map((v, i) => [`메뉴 ${i + 1}`, esc(v) + ($('p' + i).value ? ` · ${$('p' + i).value}원` : '') + ($('ph' + i).files.length ? ' · 사진' : '')]),
    ['사진', `${p} / 3장${p === 3 ? ' (첫 달 무료)' : ''}`],
    ['연락처', esc($('tel').value)],
    ['마친 시각', t.toTimeString().slice(0, 5)],
  ].map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('');
  show(3);
};

$('reset').onclick = () => location.reload();
</script>
</body></html>
