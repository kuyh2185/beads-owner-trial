<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Beads 사장님 가게 신청</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink: #0A0A0A; --sub: #5C5C5C; --line: #DADADA; --bg: #FFFFFF; --soft: #F4F4F2; --red: #D42C24; --red-dark: #B3221B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  .trial { background: var(--soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--sub); margin-bottom: 20px; }
  .trial b { color: var(--red); }
  .step { font-size: 14px; color: var(--sub); font-weight: 600; margin: 0 0 4px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 20px; letter-spacing: -0.01em; }
  label { display: block; font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
  .hint { font-weight: 400; color: var(--sub); font-size: 14px; }
  input[type=text], input[type=tel] { width: 100%; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 14px; font: inherit; color: var(--ink); background: #fff; }
  input:focus { outline: none; border-color: var(--ink); }
  .bad { border-color: var(--red) !important; }
  .err { color: var(--red); font-size: 14px; margin-top: 6px; min-height: 0; }
  .pick { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; min-height: 120px; border: 1.5px dashed #A8A8A8; border-radius: 12px; color: var(--sub); text-align: center; cursor: pointer; overflow: hidden; position: relative; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pick img { width: 100%; max-height: 220px; object-fit: contain; display: block; }
  .pick.small { min-height: 52px; flex-direction: row; font-size: 15px; }
  .pick.small img { width: 52px; height: 52px; object-fit: cover; }
  .menu { border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 14px 14px; margin-top: 14px; }
  .menu .row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .menu label { margin-top: 10px; }
  button { width: 100%; min-height: 56px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; font-size: 18px; margin-top: 28px; cursor: pointer; }
  .go { background: var(--red); color: #fff; }
  .go:active { background: var(--red-dark); }
  .back { background: none; color: var(--sub); font-weight: 500; font-size: 16px; margin-top: 8px; }
  .note { text-align: center; color: var(--sub); font-size: 13px; margin-top: 14px; }
  .done { text-align: center; padding-top: 24px; }
  .done .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 32px; margin: 0 auto 16px; }
  .sum { text-align: left; background: var(--soft); border-radius: 12px; padding: 14px 16px; margin-top: 20px; font-size: 15px; }
  .sum div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .sum span:first-child { color: var(--sub); flex: none; }
  .sum span:last-child { text-align: right; }
  [hidden] { display: none !important; }
</style>
</head><body><main>

<div class="trial"><b>시범용 화면</b> · 넣으신 정보와 사진은 이 휴대폰 밖으로 나가지 않고 저장되지 않아요.</div>

<!-- 1/2 -->
<section id="s1">
  <p class="step">사장님 가게 신청 1/2</p>
  <h1>사장님 가게인지<br>확인할게요</h1>

  <label for="store">가게 이름</label>
  <input id="store" type="text" autocomplete="off" placeholder="예: 예시반점">

  <label for="biz">사업자등록번호 <span class="hint">10자리</span></label>
  <input id="biz" type="tel" inputmode="numeric" autocomplete="off" placeholder="000-00-00000" maxlength="12">

  <label>사업자등록증 사진</label>
  <div class="pick" id="certBox">
    <span id="certText">📄 사진 찍기 / 앨범에서 고르기</span>
    <img id="certImg" alt="고른 사업자등록증" hidden>
    <input id="cert" type="file" accept="image/*" aria-label="사업자등록증 사진 고르기">
  </div>

  <label for="owner">대표자 이름</label>
  <input id="owner" type="text" autocomplete="off" placeholder="예: 홍길동">

  <p class="err" id="e1" role="alert"></p>
  <button class="go" id="next">다음 · 메뉴 등록</button>
</section>

<!-- 2/2 -->
<section id="s2" hidden>
  <p class="step">사장님 가게 신청 2/2</p>
  <h1>손님 생각이 가장 궁금한<br>메뉴 3개를 골라 주세요</h1>
  <div id="menus"></div>
  <p class="err" id="e2" role="alert"></p>
  <button class="go" id="finish">신청 끝내기</button>
  <button class="back" id="prev">이전</button>
</section>

<!-- 끝 -->
<section id="s3" class="done" hidden>
  <div class="mark">✓</div>
  <h1>시범 신청을 마쳤어요</h1>
  <p style="color:var(--sub);margin:0">정식판이 열리면 이 화면 그대로 신청하시게 돼요.<br>지금 넣으신 정보는 저장되지 않았어요.</p>
  <div class="sum" id="sum"></div>
  <button class="back" id="reset">처음부터 (다음 가게)</button>
</section>

<p class="note">서강대 창업팀 Beads · 시범용 창 · 실제로 저장되지 않음</p>
</main>

<script>
const $ = id => document.getElementById(id);
const show = n => { ['s1', 's2', 's3'].forEach((s, i) => $(s).hidden = i !== n - 1); scrollTo(0, 0); };

function preview(input, img, text) {
  input.addEventListener('change', () => {
    const f = input.files[0];
    if (!f) return;
    img.src = URL.createObjectURL(f); // stays on this phone, never uploaded
    img.hidden = false; if (text) text.hidden = true;
    input.closest('.pick').classList.remove('bad');
  });
}

$('biz').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 10);
  e.target.value = d.length > 5 ? `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
});
preview($('cert'), $('certImg'), $('certText'));

const examples = [['짜장면', '7,000'], ['짬뽕', '8,000'], ['탕수육', '15,000']];
$('menus').innerHTML = examples.map(([n, p], i) => `
  <div class="menu">
    <div class="row">
      <div><label for="m${i}">메뉴 ${i + 1}</label><input id="m${i}" type="text" autocomplete="off" placeholder="예: ${n}"></div>
      <div><label for="p${i}">가격</label><input id="p${i}" type="tel" inputmode="numeric" autocomplete="off" placeholder="${p}"></div>
    </div>
    <label>메뉴 사진 <span class="hint">(고르기)</span></label>
    <div class="pick small"><span id="pt${i}">📷 사진 고르기</span><img id="pi${i}" alt="" hidden><input id="ph${i}" type="file" accept="image/*" aria-label="메뉴 ${i + 1} 사진 고르기"></div>
  </div>`).join('');
examples.forEach((_, i) => {
  preview($('ph' + i), $('pi' + i), $('pt' + i));
  $('p' + i).addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 7);
    e.target.value = d ? Number(d).toLocaleString('ko-KR') : '';
  });
});

function check(fields, errBox) {
  let first = null;
  fields.forEach(([el, ok]) => { el.classList.toggle('bad', !ok); if (!ok && !first) first = el; });
  errBox.textContent = first ? '빨간 칸을 채워 주세요.' : '';
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return !first;
}

$('next').onclick = () => {
  const ok = check([
    [$('store'), $('store').value.trim()],
    [$('biz'), $('biz').value.replace(/\D/g, '').length === 10],
    [$('certBox'), $('cert').files.length > 0],
    [$('owner'), $('owner').value.trim()],
  ], $('e1'));
  if (ok) show(2);
};
$('prev').onclick = () => show(1);

$('finish').onclick = () => {
  const names = [0, 1, 2].map(i => $('m' + i).value.trim());
  if (!check(names.map((n, i) => [$('m' + i), n]), $('e2'))) return;
  if (new Set(names).size < 3) { $('e2').textContent = '서로 다른 메뉴 3개를 넣어 주세요.'; return; }
  const t = new Date();
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // summary is for the field team to copy onto the paper log (H3 = both windows finished by the owner)
  $('sum').innerHTML = [
    ['가게', esc($('store').value.trim())],
    ['1/2 창', '끝 (등록번호 + 등록증 사진)'],
    ...names.map((n, i) => [`메뉴 ${i + 1}`, esc(n) + ($('p' + i).value ? ` · ${$('p' + i).value}원` : '')]),
    ['마친 시각', t.toTimeString().slice(0, 5)],
  ].map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('');
  show(3);
};

$('reset').onclick = () => location.reload();
</script>
</body></html>
